<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
</head>
<body>
     <p id="add"></p>
     <p id="sub"></p>
     <p id="mul"></p>
     <p id="div"></p>
     
     <script>
          var x = 10;
          var y = 5;

          document.getElementById("add").innerHTML = "Addition = " + (x + y);
          document.getElementById("sub").innerHTML = "Subtraction = " + (x - y);
          document.getElementById("mul").innerHTML = "Multiplication = " + (x * y);
          document.getElementById("div").innerHTML = "Division = " + (x / y);
     </script>
     
     
</body>
</html>
